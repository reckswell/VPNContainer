# SSO hand-off test: a fake GlobalProtect portal (prelogin only). Used with
# compose.lab.yaml by tests/lab/run-sso.sh.
services:
  gtvpn:
    environment:
      GTVPN_PORTAL: fakeportal.lab.test
      GTVPN_CONTROL_ALLOW_CIDRS: "172.30.66.10/32 172.30.66.20/32 172.30.66.30/32"
      GTVPN_AUTH_ARGS: "--ignore-tls-errors"
      GTVPN_AUTH: saml
  fakeportal:
    image: python:3.12-alpine
    container_name: gtvpn-lab-fakeportal
    command: ["python", "-u", "/srv/srv.py"]
    volumes: ["./tests/lab/fakeportal:/srv:ro"]
    networks:
      gtvpn_net:
        ipv4_address: 172.30.66.30
        aliases: [fakeportal.lab.test]
