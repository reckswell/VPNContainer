# vpncontainer: Georgia Tech GlobalProtect inside an isolated container.
# Use the ./vpncontainer wrapper: it fills in .env and passes the settings from
# vpncontainer.toml. Plain `docker compose` works too, but reads only .env.
name: vpncontainer

services:
  vpncontainer:
    build:
      context: ./image
      args:
        BASE_IMAGE: ${VPNCONTAINER_BASE_IMAGE:-ubuntu:24.04}
        INSTALL_CLAUDE_CODE: ${VPNCONTAINER_INSTALL_CLAUDE_CODE:-1}
        CLAUDE_CODE_VERSION: ${VPNCONTAINER_CLAUDE_CODE_VERSION:-latest}
    image: vpncontainer:local
    container_name: vpncontainer
    hostname: vpncontainer
    init: true
    restart: "no"
    stop_grace_period: 15s

    # --- Isolation ---------------------------------------------------------
    # Own network namespace (never `network_mode: host`): the tunnel, its
    # routes and its DNS exist only in here. NET_ADMIN is scoped to this
    # namespace; it cannot touch the host's routing table.
    networks: [vpncontainer_net]
    cap_drop: [ALL]
    cap_add:
      - NET_ADMIN        # create tun0, set routes, apply the kill-switch
      - NET_RAW          # ping / iptables
      - SETUID           # sshd privilege separation, drop to 'dev'
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SYS_CHROOT       # sshd privsep
      - AUDIT_WRITE      # sshd login records
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
    # Root-only memory for a saved GT password on its way to the sign-in
    # (vpncontainer-login.conf): it is never written to disk, and is gone at once.
    tmpfs:
      - /run/vpncontainer/secret:mode=0700,size=64k,noexec,nosuid,nodev
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv6.conf.default.disable_ipv6: 1
      net.ipv4.conf.all.src_valid_mark: 1
    # Only ever published on the host's loopback.
    ports:
      - "127.0.0.1:${VPNCONTAINER_SSH_PORT:-2222}:2222"

    # --- Resources (edit in .env) -------------------------------------------
    cpus: ${VPNCONTAINER_CPUS:-2}
    mem_limit: ${VPNCONTAINER_MEMORY:-2g}
    memswap_limit: ${VPNCONTAINER_MEMORY:-2g}
    pids_limit: ${VPNCONTAINER_PIDS:-512}

    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      VPNCONTAINER_PROVIDER: ${VPNCONTAINER_PROVIDER:-globalprotect}
      VPNCONTAINER_PORTAL: ${VPNCONTAINER_PORTAL:-vpn.gatech.edu}
      VPNCONTAINER_GATEWAY: ${VPNCONTAINER_GATEWAY:-}
      VPNCONTAINER_SKIP_PORTAL: ${VPNCONTAINER_SKIP_PORTAL:-0}
      VPNCONTAINER_CLIENT: ${VPNCONTAINER_CLIENT:-auto}
      VPNCONTAINER_GATEWAY_NAME: ${VPNCONTAINER_GATEWAY_NAME:-}
      VPNCONTAINER_AUTH: ${VPNCONTAINER_AUTH:-auto}
      VPNCONTAINER_USER: ${VPNCONTAINER_USER:-}
      VPNCONTAINER_HIP: ${VPNCONTAINER_HIP:-0}
      VPNCONTAINER_OS: ${VPNCONTAINER_OS:-}
      VPNCONTAINER_CLIENT_VERSION: ${VPNCONTAINER_CLIENT_VERSION:-}
      VPNCONTAINER_FIX_OPENSSL: ${VPNCONTAINER_FIX_OPENSSL:-0}
      VPNCONTAINER_CLIENT_ARGS: ${VPNCONTAINER_CLIENT_ARGS:-}
      VPNCONTAINER_AUTH_ARGS: ${VPNCONTAINER_AUTH_ARGS:-}
      VPNCONTAINER_GT_USER: ${VPNCONTAINER_GT_USER:-}
      VPNCONTAINER_SSH_HOSTS: ${VPNCONTAINER_SSH_HOSTS:-}
      VPNCONTAINER_PROBE_TARGETS: ${VPNCONTAINER_PROBE_TARGETS:-}
      VPNCONTAINER_PROBE_NAMES: ${VPNCONTAINER_PROBE_NAMES:-gatech.edu}
      VPNCONTAINER_EGRESS_URL: ${VPNCONTAINER_EGRESS_URL:-}
      VPNCONTAINER_BLOCK_PRIVATE: ${VPNCONTAINER_BLOCK_PRIVATE:-1}
      VPNCONTAINER_CONTROL_ALLOW_CIDRS: ${VPNCONTAINER_CONTROL_ALLOW_CIDRS:-}
      VPNCONTAINER_DISPLAY: ${VPNCONTAINER_DISPLAY:-:0}
      # Allow-listed direct path (off the GT tunnel) for Claude Code / dev tools
      VPNCONTAINER_DIRECT_EGRESS: ${VPNCONTAINER_DIRECT_EGRESS:-1}
      VPNCONTAINER_DIRECT_ALLOW: ${VPNCONTAINER_DIRECT_ALLOW:-api.anthropic.com claude.ai platform.claude.com console.anthropic.com statsig.anthropic.com downloads.claude.ai}
      VPNCONTAINER_NO_PROXY_EXTRA: ${VPNCONTAINER_NO_PROXY_EXTRA:-}

    volumes:
      - home:/home/dev                        # your container home (ssh keys, configs)
      - state:/var/lib/vpncontainer           # sshd host key
      - ./runtime/in:/run/vpncontainer/in:ro  # authorized_keys, X11 cookie (from host)
      - ./runtime/out:/run/vpncontainer/out   # sign-in URL, host key, last verify report
      - ${VPNCONTAINER_X11_DIR:-/tmp/.X11-unix}:/tmp/.X11-unix:ro
      - ${VPNCONTAINER_SHARE_DIR:-./share}:/home/dev/share   # optional files shared with the host

networks:
  vpncontainer_net:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"

volumes:
  home:
  state:
