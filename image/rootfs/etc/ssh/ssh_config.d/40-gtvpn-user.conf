# Your hosts from [[hosts]] in gtvpn.toml (the host's `gtvpn hosts` writes
# them as ssh config to runtime/in/hosts.conf; gtvpn-hosts installs a
# root-owned copy, because ssh refuses config files that others can write,
# and a Windows-drive checkout shows every file as 0777).
Include /etc/gtvpn/user-hosts.conf
Include /etc/gtvpn/user-hosts-defaults.conf
