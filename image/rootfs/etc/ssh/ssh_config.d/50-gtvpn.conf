# Defaults for ssh *from inside* the gtvpn container to Georgia Tech hosts.
# Your own ~/.ssh/config (persisted in the dev home volume) overrides these.
Host *.gatech.edu
    # X11 for Cadence Virtuoso / Vivado. "Trusted" forwarding is required by
    # Virtuoso; the remote apps can see other X11 windows on your display
    # (not native Wayland/Windows apps). Set ForwardX11Trusted no to tighten.
    ForwardX11 yes
    ForwardX11Trusted yes
    Compression yes
    # One Duo prompt per host, then reuse the connection for 8 hours.
    ControlMaster auto
    ControlPath ~/.ssh/cm-%C
    ControlPersist 8h
    ServerAliveInterval 30
    ServerAliveCountMax 4
Host *
    HashKnownHosts no
    ForwardAgent no
