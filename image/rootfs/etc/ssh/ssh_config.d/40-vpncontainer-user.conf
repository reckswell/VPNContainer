# Your hosts from [[hosts]] in vpncontainer.toml (the host's `vpncontainer hosts` writes
# them as ssh config to runtime/in/hosts.conf; vpncontainer-hosts installs a
# root-owned copy, because ssh refuses config files that others can write,
# and a Windows-drive checkout shows every file as 0777).
Include /etc/vpncontainer/user-hosts.conf
Include /etc/vpncontainer/user-hosts-defaults.conf
