# GT VPN sign-in for Start-GtVpn.cmd and ./gtvpn connect. The first start
# copies this file to gtvpn-login.conf (same folder); fill that one in.
# gtvpn-login.conf stays on this computer: git ignores it, so it is never
# committed or pushed. Keep THIS file empty.
#
# Write each value as it is, without quotes. Spaces at the start or end of a
# value are dropped.

# Your GT username (e.g. gburdell3).
username=

# Your GT password. On Windows, Start-GtVpn.cmd encrypts it the first time it
# runs: it moves it to password_dpapi, readable only by your Windows account
# on this PC, and empties this line. Or save it encrypted directly with
#     Start-GtVpn.cmd -SavePassword
# Leave it empty to type your password each time.
password=
password_dpapi=

# There is no Duo setting: the Duo code changes every time, so you type it
# when GT asks. If GT refuses the saved password, gtvpn stops after that one
# try and asks you to type it until you change this file, so a wrong saved
# password cannot lock your GT account.
